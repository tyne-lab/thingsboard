services:
  postgres:
    image: "postgres:16"
    container_name: thingsboard-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  cassandra:
    image: "cassandra:5.0"
    container_name: thingsboard-cassandra
    restart: unless-stopped
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
  thingsboard-ce:
    image: ${THINGSBOARD_CE_IMAGE}:${THINGSBOARD_VERSION}
    container_name: thingsboard-ce
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "7070:7070"
      - "1883:1883"
      - "8883:8883"
      - "5683-5688:5683-5688/udp"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    env_file:
      - .env
    volumes:
      - ./tb-node/conf:/config
      - ./tb-node/log:/var/log/thingsboard
    depends_on:
      postgres:
        condition: service_healthy
      cassandra:
        condition: service_healthy
volumes:
  postgres-data:
    name: tb-postgres-data
    driver: local
  cassandra-data:
    name: tb-cassandra-data
    driver: local
