name: TYNE release build

on:
  push:
    branches:
      # x.y (v3.7, v4.0), x.y.z (v3.6.4), x.y.z.n (LTS: v4.2.2.3)
      - 'tyne/release/[0-9]+.[0-9]+'
      - 'tyne/release/[0-9]+.[0-9]+.[0-9]+'
      - 'tyne/release/[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  SOURCE_IMAGE: thingsboard/tb-node
  TARGET_IMAGE: xuantruonglk02/tyne-tb-node

jobs:
  build-and-push:
    name: Build and push tyne-tb-node
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate release branch name
        id: branch
        run: |
          BRANCH_VERSION="${GITHUB_REF_NAME#tyne/release/}"
          if [[ ! "$BRANCH_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Branch '$GITHUB_REF_NAME' is not a tyne/release/x.y[.z[.n]] branch"
            exit 1
          fi
          echo "Branch version: $BRANCH_VERSION"
          echo "version=$BRANCH_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'maven'

      # Maven tag image theo `${project.version}` trong pom.xml, nên đó mới là tag thật của image;
      # tên nhánh chỉ dùng để trigger + sanity check. Upstream đặt tag 2 số (v3.7, v4.0) nhưng pom
      # bên trong là 3.7.0 / 4.0.0, nên nhánh 2 số được chấp nhận nếu pom chỉ thêm hậu tố '.0'.
      - name: Resolve image version from pom
        id: version
        env:
          BRANCH_VERSION: ${{ steps.branch.outputs.version }}
        run: |
          POM_VERSION=$(mvn -B -q -N help:evaluate -Dexpression=project.version -DforceStdout | tail -n 1)
          if [[ "$POM_VERSION" != "$BRANCH_VERSION" && "$POM_VERSION" != "$BRANCH_VERSION.0" ]]; then
            echo "::error::pom.xml version '$POM_VERSION' does not match branch '$GITHUB_REF_NAME'"
            exit 1
          fi
          echo "Image version: $POM_VERSION"
          echo "version=$POM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # TYNE deploy dạng monolith nên chỉ cần image tb-node.
      # `-pl msa/tb-node -am` build tb-node + toàn bộ module nó phụ thuộc (application, ui-ngx, dao, ...)
      # và bỏ qua các image microservice khác (msa/tb, web-ui, vc-executor, transport/*, js-executor, monitoring).
      # Khi nào cần chạy microservice thì bỏ `-pl msa/tb-node -am` để build đủ image, và bổ sung
      # các bước retag/push tương ứng bên dưới.
      - name: Build ThingsBoard and tb-node Docker image
        run: mvn clean install -DskipTests -Ddockerfile.skip=false -pl msa/tb-node -am

      - name: Retag tb-node image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: docker tag "$SOURCE_IMAGE:$VERSION" "$TARGET_IMAGE:$VERSION"

      - name: Push image to Docker Hub
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: docker push "$TARGET_IMAGE:$VERSION"
