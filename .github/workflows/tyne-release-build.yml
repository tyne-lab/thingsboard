name: TYNE release build

on:
  push:
    branches:
      - 'tyne/release/[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  SOURCE_IMAGE: thingsboard/tb-node
  TARGET_IMAGE: xuantruonglk02/tyne-tb-node

jobs:
  build-and-push:
    name: Build and push tyne-tb-node
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve release version from branch name
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#tyne/release/}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Branch '$GITHUB_REF_NAME' is not a tyne/release/x.y.z branch"
            exit 1
          fi
          echo "Release version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'maven'

      - name: Check pom version matches branch version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          POM_VERSION=$(mvn -B -q -N help:evaluate -Dexpression=project.version -DforceStdout | tail -n 1)
          if [[ "$POM_VERSION" != "$VERSION" ]]; then
            echo "::error::pom.xml version '$POM_VERSION' does not match branch version '$VERSION'"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # TYNE deploy dạng monolith nên chỉ cần image tb-node.
      # `-pl msa/tb-node -am` build tb-node + toàn bộ module nó phụ thuộc (application, ui-ngx, dao, ...)
      # và bỏ qua các image microservice khác (msa/tb, web-ui, vc-executor, transport/*, js-executor, monitoring).
      # Khi nào cần chạy microservice thì bỏ `-pl msa/tb-node -am` để build đủ image, và bổ sung
      # các bước retag/push tương ứng bên dưới.
      - name: Build ThingsBoard and tb-node Docker image
        run: mvn clean install -DskipTests -Ddockerfile.skip=false -pl msa/tb-node -am

      - name: Retag tb-node image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: docker tag "$SOURCE_IMAGE:$VERSION" "$TARGET_IMAGE:$VERSION"

      - name: Push image to Docker Hub
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: docker push "$TARGET_IMAGE:$VERSION"
